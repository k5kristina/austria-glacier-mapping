[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "austria-glacier-monitoring"
version = "2.0.0"
description = "Glacier mapping in the Austrian Alps from Sentinel-2: baselines vs. U-Net, area trends 2017-2025"
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "Kristina Krymova" }]
keywords = ["remote-sensing", "sentinel-2", "glacier-segmentation", "deep-learning", "austrian-alps"]
dependencies = [
    "numpy>=1.26",
    "scipy>=1.11",
    "pandas>=2.1",
    "scikit-learn>=1.4",
    "torch>=2.1",
    "matplotlib>=3.8",
    "pyyaml>=6.0",
    "requests>=2.31",
    "rasterio>=1.3.9",
    "pyproj>=3.6",
    "shapely>=2.0",
    "pyshp>=2.3",
]

[project.optional-dependencies]
app = ["streamlit>=1.32"]
dev = ["pytest>=8.0", "ruff>=0.6", "black>=24.0"]

[project.scripts]
glacier-pipeline = "glacier_monitoring.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP", "B"]
ignore = ["E501"]

[tool.black]
line-length = 100
target-version = ["py310", "py311", "py312"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-v --tb=short"
